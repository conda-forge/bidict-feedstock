schema_version: 1

context:
  version: "0.24.1"
  python_min: "3.11"

package:
  name: bidict
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/bidict/bidict-${{ version }}.tar.gz
  sha256: 4dca6c17f0b01700e9f24359daa5ebabf7be022d99f4cb2a257b6af2a5076c88

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv_build >=0.8.13,<0.12
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.0

tests:
  - python:
      imports:
        - bidict
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  license: MPL-2.0
  license_file: LICENSE
  summary: Efficient, Pythonic bidirectional map implementation and related functionality
  homepage: https://bidict.readthedocs.io
  repository: https://github.com/jab/bidict
  documentation: https://bidict.readthedocs.io

extra:
  recipe-maintainers:
    - synapticarbors
    - jab
